# iPhone app and CarPlay screen for ToyotaDash.
# Generate the Xcode project with `xcodegen` in this folder, then open ToyotaDash.xcodeproj.
# The Kotlin shared module is compiled by Gradle in a pre-build step (standard KMP setup).
name: ToyotaDash
options:
  bundleIdPrefix: com.moudjane
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ToyotaDash:
    type: application
    platform: iOS
    sources:
      - ToyotaDash
    info:
      path: ToyotaDash/Info.plist
      properties:
        CFBundleDisplayName: ToyotaDash
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: "ToyotaDash se connecte au dongle OBD2 Bluetooth pour afficher les données de la voiture."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIAppFonts:
          - barlow_thin.ttf
          - barlow_light.ttf
          - barlow_regular.ttf
          - barlow_medium.ttf
          - barlow_semi_bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moudjane.toyotadash
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # CarPlay entitlement on the simulator only: real devices need Apple's approval first.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": ToyotaDash/ToyotaDash.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          if [ -z "$JAVA_HOME" ]; then export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null)"; fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
